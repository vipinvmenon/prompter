<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="800"
  height="300"
  viewBox="0 0 800 300"
  role="img"
  aria-label="Prompter logo: speech bubble icon with three lines and the word Prompter">
  <defs>
    <linearGradient id="blueGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3FA0FF"/>
      <stop offset="1" stop-color="#2F8BFF"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B2A33" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background (transparent) -->
  <!-- Icon group -->
  <g transform="translate(40,20)">
    <!-- Outer stroke for the bubble -->
    <path
      d="M240 24.5H48C36.9543 24.5 28 33.4543 28 44.5V140.5C28 151.546 36.9543 160.5 48 160.5H188.5L228 178.5C233.5 181.5 240 177 240 170.5V48.5C240 37.4543 231.0457 28.5 220 28.5Z"
      fill="#0B2A33"
      transform="translate(0,0)"/>
    <!-- Inner bubble -->
    <path
      d="M232 34H56C46.0589 34 38 42.0589 38 52V128C38 137.941 46.0589 146 56 146H196.5L228 166.5C231.166 168.666 236 165.25 236 161V52C236 42.0589 227.9411 34 218 34Z"
      fill="url(#blueGrad)"
      filter="url(#softShadow)"/>
    <!-- Three text lines -->
    <g transform="translate(64,62)">
      <rect x="0" y="0" rx="8" ry="8" width="144" height="14" fill="#FFFFFF" opacity="0.96"/>
      <rect x="0" y="30" rx="8" ry="8" width="110" height="14" fill="#FFFFFF" opacity="0.96"/>
      <rect x="0" y="60" rx="8" ry="8" width="88" height="14" fill="#FFFFFF" opacity="0.96"/>
    </g>
  </g>
  <!-- Wordmark -->
  <g transform="translate(320,160)">
    <text
      x="0"
      y="48"
      font-family="Inter, Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-weight="700"
      font-size="64"
      fill="#0B2A33"
      letter-spacing="-0.5">
      Prompter
    </text>
  </g>
</svg>

